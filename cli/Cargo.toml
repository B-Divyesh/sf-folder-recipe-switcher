[package]
name = "folder-recipe"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Portable, inspectable processing recipes for photo folders"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-folder-recipe-switcher"
readme = "../README.md"
keywords = ["photography", "raw", "workflow", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

